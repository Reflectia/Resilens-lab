name: CI

on:
  push:
    branches:
      - INT_RESILENSE_2.0
      - main
  pull_request:
    branches:
      - INT_RESILENSE_2.0
      - main

permissions:
  contents: read

# Cancel the previous run of the same branch/PR when new commits arrive
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU versions of PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint Python code
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest tests
