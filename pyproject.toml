[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resilens"
version = "2.0.0.dev0"
description = "Platform for adaptive detection and multi-object tracking in degraded video"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # ML / CV core
    "numpy>=2.1",
    "opencv-python>=4.10",
    "torch>=2.6",
    "torchvision>=0.21",
    "timm>=1.0",                 # used by TANet / MWFormer model code
    # Configuration
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # Metrics and telemetry
    "pycocotools>=2.0.8",
    "scikit-image>=0.25",
    "psutil>=6.1",
    "nvidia-ml-py>=12.560",
    # Reports
    "pandas>=2.2",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    # REST API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # Web UI
    "streamlit>=1.40",
    "httpx>=0.27",               # Web UI -> REST API client
    # TODO: verify Python 3.13 compatibility, then pin as git dependencies:
    #   YOLOX      https://github.com/Megvii-BaseDetection/YOLOX   (Apache-2.0)
    #   ByteTrack  https://github.com/ifzhang/ByteTrack            (MIT)
    #   TrackEval  https://github.com/JonathonLuiten/TrackEval     (MIT; HOTA, IDF1, ID switches)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
resilens = "resilens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]
