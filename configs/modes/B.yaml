name: B
description: TANet cleared
use_analyzer: false
use_policy: false
enhancer: tanet
enhancer_params:
  weights_path: weights/tanet.pth
  scale: 0.25  # TANet runs on a quarter-size frame: ~0.5 s instead of ~9 s per 1080p frame on CPU
detector: yolox_nano
detector_params:
  weights_path: weights/yolox_nano_coco.pth
  class_ids: [0]  # COCO person: MOT20 ground truth annotates pedestrians only
tracker: flow  # optical flow, targets from the first frame with detections (docs/TRACKER.md)
