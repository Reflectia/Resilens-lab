name: standard
device: cpu
cpu_threads: 4  # hardware: 4 CPUs, 8 GB RAM, as in docker-compose.standard.yml (T-20)
max_resolution: null  # (width, height); larger videos are rejected
downscale_resolution: [1280, 720]  # (width, height) for the policy's downscale action
frame_budget_ms: 200  # ~1.1 x p95 of mode A on this profile (docs/PROFILES.md)
memory_limit_mb: 8192  # the Docker memory limit
cpu_limit_percent: null  # not checked: a run always uses all its cpu_threads, so CPU is always near the limit
gpu_memory_limit_mb: null
